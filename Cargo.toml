[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
annotate-snippets = "0.12.16"
clap = { version = "4", features = ["derive"] }
rowan = "0.17.0"
riddle-syntax = { path = "crates/syntax" }
riddlec = { path = "crates/riddlec" }
riddle-ast = { path = "crates/ast" }